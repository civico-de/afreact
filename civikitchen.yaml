$schema: 'https://raw.githubusercontent.com/jfilter/civikitchen/main/packages/civikitchen-scenario-schema/scenario.schema.json'
version: 1
scenario:
  name: afreact
  image: 'ghcr.io/jfilter/civikitchen:v1'
  database:
    image: 'mariadb:11.4'
  extension:
    key: afreact
    path: .
  credentials_output: file
  checks:
    - conform
    - lint
    - format
    - compatibility
    - dependencies
    - javascript
    - test
    - coverage
    - lifecycle
    - smarty
    - taint
policy:
  license: Proprietary
  npm_license: UNLICENSED
  copyright: 'civico GmbH'
  # The bundle is built by the release (and by CI), not committed.
  dist:
    build:
      tool: bun
      outputs:
        - dist/
