$schema: 'https://raw.githubusercontent.com/civico-de/civikitchen/main/packages/civikitchen-scenario-schema/scenario.schema.json'
version: 1
scenario:
  name: afreact
  image: 'ghcr.io/civico-de/civikitchen:v1'
  database:
    image: 'mariadb:11.4'
  extension:
    key: afreact
    path: .
  credentials_output: file
  checks:
    - conform
    - lint
    - format
    - compatibility
    - dependencies
    - javascript
    - test
    - coverage
    - lifecycle
    - smarty
    - taint
policy:
  license: AGPL-3.0-or-later
  npm_license: AGPL-3.0-or-later
  copyright: 'civico GmbH'
  untagged_versions:
    - version: "0.1.0"
      reason: "withdrawn before afreact went public; 0.2.0 is the first release"
  civicrm_floor_reasons:
    - version: "6.20"
      reason: "afreact supports the latest core release only (docs/adr/0011-latest-core-release-only.md)"
  # Dispatched by contactlayout, which afreact supports without requiring it.
  known_hooks:
    - contactSummaryBlocks
  # The bundle is built by the release (and by CI), not committed.
  dist:
    build:
      tool: bun
      outputs:
        - dist/
